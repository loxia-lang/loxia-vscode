version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    # Major bumps of the toolchain (ESLint 10, TypeScript 7, @types/vscode 2.x) are
    # manual: they change the lint/type surface and need a code change in the same PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Must match engines.vscode (^1.85.0); a newer @types/vscode would advertise
      # APIs the minimum VS Code does not have.
      - dependency-name: "@types/vscode"
      # @vscode/vsce 4.1.1 requires minimatch ^10.2.6 and the patched 11.x has no
      # compatible vsce release yet. It is a dev-only packaging dependency and never
      # ships in the VSIX; track it until vsce moves.
      - dependency-name: "minimatch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
