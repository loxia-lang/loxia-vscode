name: CodeQL

# Advanced configuration with pinned actions. GitHub's default setup must stay off while
# this file exists; the analysis runs on pull requests, `main`, and weekly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the analysis to the Security tab
      actions: read # workflow run metadata CodeQL attaches to the results
      contents: read # the repository being analysed
      packages: read # CodeQL query packs
    strategy:
      fail-fast: false
      matrix:
        include:
          # The extension is TypeScript plus handwritten JavaScript; no compiled language.
          - language: javascript-typescript
            build-mode: none
          # Workflow files are YAML, but CodeQL can audit the action pins and expressions.
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
