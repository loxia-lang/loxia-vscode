name: Release

# Publishing is a tag action: push vX.Y.Z from main after the version bump and CHANGELOG
# entry are merged. The manual path only packages the VSIX; it never publishes a branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run release:check
      - run: npm run package
      - name: Resolve VSIX
        id: vsix
        run: |
          file="$(find dist -maxdepth 1 -name '*.vsix' -print -quit)"
          if [ -z "$file" ]; then
            echo "::error::vsce did not produce a VSIX"
            exit 1
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCE_PAT is not configured for the loxia-lang publisher."
            exit 1
          fi
          npx --no-install vsce publish --packagePath "${{ steps.vsix.outputs.path }}"

      - name: Publish to Open VSX
        if: github.event_name == 'push'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OVSX_PAT is not configured for the loxia-lang namespace."
            exit 1
          fi
          npx --no-install ovsx publish "${{ steps.vsix.outputs.path }}" --pat "$OVSX_PAT"

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.vsix.outputs.path }}" \
            --verify-tag \
            --title "Loxia VS Code $GITHUB_REF_NAME" \
            --generate-notes

      - name: Store the VSIX
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error
